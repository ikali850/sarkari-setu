# ===== SITE CONFIG: change these any time, then restart =====
# You can also copy this file next to the jar (./site.properties) to override without rebuilding.

site.name=Sarkari Setu
site.tagline=Every sarkari recruitment, tracked stage by stage
# Your real domain (no trailing slash). Used for canonical links, sitemap and sharing.
site.base-url=http://localhost:8080
site.contact-email=contact@example.com
site.phone=
site.address=
# Social and channel links (leave empty to hide)
site.telegram-url=
site.whatsapp-url=
site.instagram-url=
site.youtube-url=
# Google Analytics measurement id like G-XXXXXXX (leave empty to disable)
site.analytics-id=
site.theme-color=#1d3fbf
site.footer-note=Information is collected from official sources. Always verify on the official website before applying.
# Short disclaimer shown on the home page and footer
site.disclaimer-note=We are not government employees and this is not an official government website or portal. We only share information collected from official sources. Always verify on the official website before applying, and never pay anyone money for a job.
# Image used when your links are shared on WhatsApp/Telegram/Facebook (full address, 1200x630 works best). Leave empty to skip.
site.og-image=
# Show the cookie notice bar (true/false)
site.cookie-notice=true
# Home page and lists
site.trending-count=10
site.page-size=12
# Extra sections shown on the home page under the main tabs (section slugs, comma separated, 6 posts each)
site.home-sections=answer-key,syllabus,admission
# Filter chips shown on section pages (comma separated)
site.filter-tags=10th,12th,Graduate,ITI,Diploma,Railway,Police,Bank

# ===== FIRST RUN (creates the first Super Admin only if no user exists) =====
site.seed-admin-name=Super Admin
site.seed-admin-email=admin@example.com
site.seed-admin-password=ChangeMe@123
# The sample posts live in demo-data.txt (separate file, one post per line). Adds about 120 posts (all sections) on first run, only when the database has no posts. Set false for a clean site.
site.seed-demo=true
# Optional: path of your own copy of the demo file (used instead of the built-in one if it exists)
site.demo-file=./demo-data.txt
