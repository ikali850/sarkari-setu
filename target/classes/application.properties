spring.application.name=sarkari-setu
server.port=8080

# Site settings live in site.properties (inside the jar) and can be overridden by a site.properties file placed next to the jar.
spring.config.import=optional:classpath:site.properties,optional:file:./site.properties

# Database: H2 file database by default, so the app runs with no setup.
spring.datasource.url=jdbc:h2:file:./data/sarkari
spring.datasource.username=sa
spring.datasource.password=
# MySQL (uncomment these 3 lines and comment the H2 ones above):
#spring.datasource.url=jdbc:mysql://localhost:3306/sarkari?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
#spring.datasource.username=root
#spring.datasource.password=change-me

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.thymeleaf.cache=false
server.servlet.session.timeout=60m
server.error.include-message=never

# ===== LOGGING: every page request is logged (method, path, status, time, user) =====
# Console + file. Find the file at ./logs/sarkari.log (rolls over daily and by size).
logging.level.root=INFO
logging.level.com.sarkarisetu=INFO
# Logger "PAGE" = page requests. Set to WARN to see only errors and missing pages, DEBUG for the most detail.
logging.level.PAGE=INFO
logging.file.name=logs/sarkari.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.pattern.console=%d{HH:mm:ss} %-5level %-12logger{12} %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %-12logger{12} %msg%n

# Image uploads (Admin > Media)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
